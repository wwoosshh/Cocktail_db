<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cocktail Engine — 조합 대조</title>
<style>
  :root {
    --bg: #14110f; --panel: #1f1a17; --line: #3a322c; --ink: #f3ece4;
    --muted: #a8998a; --accent: #e0913b; --good: #6fbf73; --bad: #d2715e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: .5px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .wrap { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 70px); }
  .col { padding: 20px 24px; }
  .col.left { border-right: 1px solid var(--line); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 12px; }
  .role-group { margin-bottom: 16px; }
  .role-group .label { font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 5px 10px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .build { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .build:empty::after { content: "재료를 골라 담으세요"; color: var(--muted); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .name { font-weight: 600; min-width: 110px; }
  select, button {
    background: #2a231e; color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 8px; font-size: 12px; font-family: inherit;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #1a1209; border-color: var(--accent); font-weight: 700; }
  button.x { color: var(--bad); border-color: transparent; background: transparent; font-size: 15px; }
  .result { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .result h3 { margin: 0 0 8px; font-size: 14px; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .badge.exact { background: rgba(111,191,115,.16); color: var(--good); }
  .badge.miss { background: rgba(210,113,94,.16); color: var(--bad); }
  .hit { font-size: 22px; font-weight: 800; color: var(--accent); margin: 4px 0; }
  ul.clean { list-style: none; margin: 6px 0 0; padding: 0; }
  ul.clean li { padding: 4px 0; font-size: 14px; border-bottom: 1px dashed var(--line); }
  ul.clean li:last-child { border-bottom: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .swap-out { font-size: 12px; color: var(--accent); margin-left: 4px; }
  code { background: #00000040; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>🍸 Cocktail Engine</h1>
  <p>재료를 담으면 — 무엇인지 식별하고, 다음 재료를 안내하고, 재료를 바꾸면 무엇이 되는지 알려줍니다. (체스 오프닝 북 방식)</p>
</header>

<div class="wrap">
  <div class="col left">
    <h2>재료 팔레트</h2>
    <div id="palette"></div>
  </div>

  <div class="col">
    <h2>내 잔 (Build)</h2>
    <div class="build" id="build"></div>
    <button class="primary" id="nearestBtn">④ 최근접 칵테일 찾기</button>

    <div style="height:16px"></div>

    <div class="result" id="identify"></div>
    <div class="result" id="explore"></div>
    <div class="result" id="nearest" style="display:none"></div>
  </div>
</div>

<script>
const ROLE_LABEL = { base:'베이스', modifier:'모디파이어', sweet:'단맛', sour:'신맛', bitters:'비터스', lengthener:'길이내기', garnish:'가니시' };
const ROLES = Object.keys(ROLE_LABEL);
let INGREDIENTS = [];
let build = []; // {ingredientId, role, bucket, name}

const $ = (id) => document.getElementById(id);
const nameOf = (id) => (INGREDIENTS.find(i => i.id === id)?.name) ?? id;
const api = (path, body) => fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(r => r.json());

async function load() {
  const data = await fetch('/api/ingredients').then(r => r.json());
  INGREDIENTS = data.ingredients;
  renderPalette();
  refresh();
}

function renderPalette() {
  const byRole = {};
  for (const ing of INGREDIENTS) (byRole[ing.defaultRole] ??= []).push(ing);
  $('palette').innerHTML = Object.entries(byRole).map(([role, list]) => `
    <div class="role-group">
      <div class="label">${ROLE_LABEL[role] ?? role}</div>
      <div class="chips">
        ${list.map(i => `<span class="chip" data-add="${i.id}" data-role="${i.defaultRole}">${i.name}</span>`).join('')}
      </div>
    </div>`).join('');
  $('palette').querySelectorAll('[data-add]').forEach(el =>
    el.addEventListener('click', () => addItem(el.dataset.add, el.dataset.role)));
}

function addItem(id, role) {
  build.push({ ingredientId: id, role, bucket: 'full', name: nameOf(id) });
  renderBuild(); refresh();
}
function removeItem(idx) { build.splice(idx, 1); renderBuild(); refresh(); }
function changeRole(idx, role) { build[idx].role = role; refresh(); }

async function doSwap(idx, newId, outEl) {
  if (!newId) return;
  const r = await api('/api/swap', { components: components(), componentIndex: idx, newIngredientId: newId });
  if (r.status === 'exact') {
    outEl.innerHTML = `→ <b>${r.matches.map(c=>c.name).join(', ')}</b> 가 됩니다`;
  } else {
    const top = r.nearest[0];
    const d = top ? `${top.cocktail.name} (거리 ${top.distance})` : '없음';
    outEl.innerHTML = `→ 이름 없는 변형. 가장 가까운: <b>${d}</b>`;
  }
}

function renderBuild() {
  $('build').innerHTML = build.map((c, i) => `
    <div class="row">
      <span class="name">${c.name}</span>
      <select data-role="${i}">
        ${ROLES.map(r => `<option value="${r}" ${r===c.role?'selected':''}>${ROLE_LABEL[r]}</option>`).join('')}
      </select>
      <select data-swap="${i}">
        <option value="">↔ 치환…</option>
        ${INGREDIENTS.map(ing => `<option value="${ing.id}">${ing.name}</option>`).join('')}
      </select>
      <span class="swap-out" data-swapout="${i}"></span>
      <button class="x" data-remove="${i}" title="제거">✕</button>
    </div>`).join('');
  $('build').querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', () => removeItem(+el.dataset.remove)));
  $('build').querySelectorAll('[data-role]').forEach(el => el.addEventListener('change', () => changeRole(+el.dataset.role, el.value)));
  $('build').querySelectorAll('[data-swap]').forEach(el => el.addEventListener('change', () =>
    doSwap(+el.dataset.swap, el.value, $('build').querySelector(`[data-swapout="${el.dataset.swap}"]`))));
}

const components = () => build.map(({ ingredientId, role, bucket }) => ({ ingredientId, role, bucket }));

async function refresh() {
  $('nearest').style.display = 'none';
  if (build.length === 0) {
    $('identify').innerHTML = '<span class="muted">재료를 담으면 식별 결과가 여기 표시됩니다.</span>';
    $('explore').innerHTML = '';
    return;
  }
  const comps = components();
  const [idr, exp] = await Promise.all([
    api('/api/identify', { components: comps }),
    api('/api/explore', { components: comps }),
  ]);

  if (idr.status === 'exact') {
    $('identify').innerHTML = `<h3>① 정확 식별 <span class="badge exact">EXACT</span></h3>
      <div class="hit">${idr.matches.map(c=>c.name).join(', ')}</div>`;
  } else {
    $('identify').innerHTML = `<h3>① 정확 식별 <span class="badge miss">MISS</span></h3>
      <div class="muted">정확히 일치하는 이름 있는 칵테일이 없습니다 (이름 없는 변형).</div>`;
  }

  const cands = exp.candidates.filter(c => c.missing.length > 0).slice(0, 6);
  $('explore').innerHTML = `<h3>② 다음 재료 안내 (오프닝 트리)</h3>` + (
    cands.length
      ? `<ul class="clean">${cands.map(c =>
          `<li><b>${c.cocktail.name}</b> — 넣으면 완성: ${c.missing.map(m => `<code>${nameOf(m.ingredientId)}</code>`).join(' + ')}</li>`).join('')}</ul>`
      : `<div class="muted">이 조합을 부분으로 갖는 미완성 칵테일이 없습니다.</div>`);
}

async function showNearest() {
  if (build.length === 0) return;
  const r = await api('/api/nearest', { components: components() });
  $('nearest').style.display = 'block';
  $('nearest').innerHTML = `<h3>④ 최근접 칵테일</h3>
    <ul class="clean">${r.results.map(x => {
      const sw = x.diff.swapped.map(s => `${nameOf(s.from)}→${nameOf(s.to)}`).join(', ');
      const ex = x.diff.extra.map(e => `+${nameOf(e.ingredientId)}`).join(', ');
      const mi = x.diff.missing.map(m => `-${nameOf(m.ingredientId)}`).join(', ');
      const parts = [sw, ex, mi].filter(Boolean).join('; ') || '동일';
      return `<li><b>${x.cocktail.name}</b> <span class="muted">거리 ${x.distance}</span> — ${parts}</li>`;
    }).join('')}</ul>`;
}

$('nearestBtn').addEventListener('click', showNearest);
load();
</script>
</body>
</html>
